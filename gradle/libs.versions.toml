[versions]
adventure = "4.24.0"
annotations = "26.0.1"
blossom = "2.1.0"
gradle-profiles = "0.54.0"
kotlin = "1.9.25"
lombok-plugin = "8.11"
paperweight = "2.0.0-beta.19"
plugin-yml-paper = "0.6.0"
shadow = "9.2.2"
zstd = "1.5.6-8"

[plugins]
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
profiles = { id = "org.kordamp.gradle.profiles", version.ref = "gradle-profiles" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
paperweight-patcher = { id = "io.papermc.paperweight.patcher", version.ref = "paperweight" }
plugin-yml-paper = { id = "net.minecrell.plugin-yml.paper", version.ref = "plugin-yml-paper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
zstd = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
